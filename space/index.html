<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>IMMUNE Lattice</title>
  <style>
    :root {
      --bg:#07090c; --elev:#0e1218; --subtle:#141a22; --fg:#e8eef4;
      --muted:#8b96a5; --primary:#5eead4; --danger:#f07167; --warn:#e8b86d;
      --ok:#7dcea0; --line:rgba(232,238,244,.12);
    }
    * { box-sizing:border-box }
    html,body { margin:0; background:var(--bg); color:var(--fg);
      font:15px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; min-height:100% }
    body { background:
      radial-gradient(90% 60% at 80% -10%, rgba(94,234,212,.08), transparent 50%),
      var(--bg) }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center;
      padding:16px 20px; border-bottom:1px solid var(--line); background:rgba(7,9,12,.85); backdrop-filter:blur(8px) }
    .mark { width:40px; height:40px; display:grid; place-items:center;
      border:1px solid var(--primary); color:var(--primary); border-radius:8px; font:700 13px ui-monospace,monospace }
    h1 { margin:0; font-size:18px; letter-spacing:.18em }
    .kicker { font:10px ui-monospace,monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--muted) }
    nav { display:flex; gap:4px; overflow-x:auto; margin-left:auto }
    nav button, .act { font:12px ui-sans-serif,system-ui; color:var(--muted); background:transparent;
      border:0; border-radius:8px; padding:10px 12px; min-height:44px; cursor:pointer }
    nav button.on, .act.primary { background:var(--primary); color:#06201c; font-weight:600 }
    .act { border:1px solid var(--line); background:var(--subtle) }
    .act.danger { border-color:rgba(240,113,103,.4); color:var(--danger) }
    main { max-width:1180px; margin:0 auto; padding:20px }
    .grid { display:grid; gap:14px }
    @media (min-width:900px) { .cols { grid-template-columns:1.15fr .85fr } }
    .panel { background:rgba(14,18,24,.88); border:1px solid var(--line); border-radius:16px; padding:16px 18px }
    h2 { margin:0; font-size:14px }
    .muted { color:var(--muted); font-size:13px }
    .mono { font-family: ui-monospace, Menlo, monospace }
    .tiny { font:10px ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--muted) }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center }
    .card { background:var(--subtle); border:1px solid var(--line); border-radius:10px; padding:12px }
    .list { display:grid; gap:8px }
    a { color:var(--primary); text-decoration:none }
    footer { padding:12px 20px; border-top:1px solid var(--line); font:10px ui-monospace,monospace;
      letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
    .ok { color:var(--ok) } .bad { color:var(--danger) } .wrap { color:var(--warn) }
    .banner { border:1px solid rgba(240,113,103,.35); background:rgba(240,113,103,.08);
      border-radius:10px; padding:10px 12px; font-size:13px }
  </style>
</head>
<body>
  <header>
    <div class="mark">Λ</div>
    <div>
      <h1>IMMUNE</h1>
      <p class="kicker">Lattice · Channel B decision cell</p>
    </div>
    <nav id="nav" aria-label="Surfaces"></nav>
  </header>
  <main id="view"></main>
  <footer>MODE=DEFENSE ONLY · HUNT · ISOLATE · DECEIVE · NO HUMAN TARGETING · Λ = CONJECTURE 1 · DOCTRINE V11</footer>
<script>
const ENGINES = [
  ["vLLM","BIND","Apache-2.0","Production GPU · PagedAttention"],
  ["llama.cpp / llama-server","BIND","MIT","Portable GGUF"],
  ["SGLang","BIND","Apache-2.0","RadixAttention agents"],
  ["TensorRT-LLM","BIND","Apache-2.0","NVIDIA compiled"],
  ["Ollama","BIND","MIT","Facade on llama.cpp — pin the GGUF"],
  ["MLX","BIND","MIT","Apple Metal"],
  ["TEI","BIND","Apache-2.0","Embeddings only"],
  ["mistral.rs","BIND","Apache-2.0","Rust serving"],
  ["CTranslate2","BIND","MIT","Encoder / whisper"],
  ["NVIDIA Dynamo","WATCH","Apache-2.0","Schedules engines"],
  ["llm-d","WATCH","Apache-2.0","K8s CRDs"],
  ["OpenAI / Anthropic / xAI","WRAP","Closed","Opaque weights"],
  ["Groq / Cerebras / SambaNova","WRAP","Closed HW","Overflow hoses"],
  ["HF Inference Providers","WRAP","SaaS","Router, not an engine"],
  ["TGI","IGNORE","Apache-2.0","Archived 2026-03-21"],
  ["Aphrodite","IGNORE","AGPL-3.0","Copyleft infects the orchestrator"],
  ["LM Studio","IGNORE","Closed","Human toy"],
];
const CANARIES = [
  ["canary-mcp","Decoy MCP server","Unsigned tool schema"],
  ["canary-space","Decoy Space · honey-index","Canary embeddings"],
  ["canary-weights","Decoy GGUF tag","Unpinned qwen-open"],
];
const ACTORS = [
  ["G0016","APT29 · Midnight Blizzard","T1195 supply chain · signed_update_hash_mismatch"],
  ["G0007","APT28 · Fancy Bear","LOTL · dual-homed Wi-Fi adjacency"],
  ["G1017","Volt Typhoon","Living-off-the-land — not malware hashes"],
  ["G1015","Scattered Spider","mfa_fatigue_burst · helpdesk_reset_then_new_session"],
  ["G0102","Wizard Spider lineage","vssadmin_resize · shadow copy delete"],
  ["C0024","SolarWinds · StellarParticle","slsa_valid_but_builder_identity_stolen"],
  ["G0032","Lazarus · APT38","unsigned_ci_runner"],
  ["G0096","APT41 · Wicked Panda","stolen_codesign_cert"],
  ["G1004","LAPSUS$","session_cookie_reuse_new_asn"],
];
const GAPS = [
  ["ECHO.RECEIPT.INFERENCE","Every completion is an in-toto Statement. Channel B mints it. The LLM never holds the key."],
  ["IMMUNE.GATE.TOOLCALL","Default deny. Unsigned tool = no process, no network, no model I/O."],
  ["GHOST.LATTICE.CANARY","Decoy Spaces / MCP / GGUF tags. Touch is P1 hunt. Real estate never shares context."],
  ["IMMUNE.COMPILER.SIGNED_KERNEL","Channel A advisory. Channel B holds effector keys and can veto A. A cannot veto B."],
];
const LEADERS = [
  ["Palantir AIP","Action Types as the only mutate path. Compiled here to Channel B."],
  ["Anduril Lattice","Click → machine-to-machine tasking. Effectors isolate objects, never people."],
  ["Sigstore + SLSA","Directory-tree hashing. Subject is (model, policy, runtime)."],
  ["DO-178C","Dissimilar channels. AI is not DAL A. Channel B is the envelope computer."],
];

let tab = "radar";
let last = null;
let chain = [];
let spaces = [];

const $ = (id) => document.getElementById(id);
function nav() {
  $("nav").innerHTML = ["radar","estate","intel","doctrine"].map(t =>
    `<button type="button" class="${t===tab?"on":""}" data-t="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`
  ).join("");
  $("nav").onclick = (e) => { const b=e.target.closest("button"); if(!b) return; tab=b.dataset.t; draw(); };
}
function verbClass(v){ return v==="IGNORE"?"bad":v==="WRAP"?"wrap":v==="WATCH"?"muted":"ok"; }

async function post(path, body) {
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  return r.json();
}
async function refreshChain() {
  try {
    const r = await fetch("/api/chain");
    const d = await r.json();
    chain = d.items || [];
  } catch {}
}
async function pullEstate() {
  try {
    const r = await fetch("https://huggingface.co/api/spaces?author=SZLHOLDINGS&limit=50");
    const d = await r.json();
    spaces = Array.isArray(d) ? d : [];
  } catch { spaces = []; }
}

async function doBind(name, verb) {
  last = await post("/api/bind", { engine:name, verb });
  await refreshChain();
  draw();
}
async function doCanary(id) {
  last = await post("/api/canary", { id });
  await refreshChain();
  draw();
}

function receiptCard() {
  if (!last) return `<p class="muted">Channel B is the only effector. Mint a BIND or trip a canary.</p>`;
  const rec = last.receipt || {};
  const cls = last.ok ? "ok" : "bad";
  return `<div class="card">
    <div class="row"><span class="tiny">Channel B</span><span class="mono ${cls}">${last.decision}</span></div>
    <p>${last.reason}</p>
    <p class="mono tiny">${(rec.hash||"").slice(0,32)}</p>
  </div>`;
}

function radar() {
  const groups = ["BIND","WRAP","WATCH","IGNORE"];
  return `<div class="grid cols">
    <section class="panel">
      <h2>Inference radar</h2>
      <p class="muted">BIND = native adapter, receipt on every completion. WRAP = opaque foreign compute. WATCH = no SLO. IGNORE = do not spend cycles. TGI is archived.</p>
      ${groups.map(g => `<div style="margin-top:14px">
        <p class="tiny ${verbClass(g)}">${g}</p>
        <div class="list" style="margin-top:8px">${ENGINES.filter(e=>e[1]===g).map(([n,v,lic,line]) =>
          `<div class="card"><div class="row"><strong>${n}</strong><span class="tiny">${lic}</span></div>
           <p class="muted">${line}</p>
           <button class="act primary" style="margin-top:8px" data-bind="${n}" data-verb="${v}">Mint receipt</button></div>`
        ).join("")}</div></div>`).join("")}
    </section>
    <section class="panel">
      <p class="tiny">Unoccupied intersection</p>
      <p class="muted">Doctrine v11 compiles to this cell. Channel A (LLM) is advisory. Channel B holds keys.</p>
      <div class="list" style="margin-top:12px">${GAPS.map(([n,t])=>`<div class="card"><p class="tiny" style="color:var(--primary)">${n}</p><p>${t}</p></div>`).join("")}</div>
      <div style="margin-top:16px">${receiptCard()}</div>
    </section>
  </div>`;
}

function estate() {
  const names = spaces.slice(0,18).map(s => s.id ? s.id.replace("SZLHOLDINGS/","") : "").filter(Boolean);
  return `<div class="grid cols">
    <section class="panel">
      <h2>Estate pulse</h2>
      <p class="muted">Live Hugging Face org SZLHOLDINGS · ${spaces.length || "—"} spaces this fetch. BUILD_ERROR is quarantined in the Grok COP.</p>
      <div class="list" style="margin-top:12px">${names.map(n=>`<div class="card row"><span>${n}</span></div>`).join("") || `<p class="muted">Hub list UNAVAILABLE this cycle.</p>`}</div>
    </section>
    <section class="panel">
      <p class="tiny">GHOST.LATTICE.CANARY</p>
      <p class="muted">Decoys. Real Spaces never share context. Any touch is P1 hunt.</p>
      <div class="banner" style="margin:12px 0">Defense only. Hunt · isolate · deceive. Never strike people.</div>
      <div class="list">${CANARIES.map(([id,n,b])=>`<div class="card"><div class="row"><strong>${n}</strong></div>
        <p class="muted">${b}</p>
        <button class="act danger" style="margin-top:8px" data-canary="${id}">Trip canary</button></div>`).join("")}</div>
      <div style="margin-top:16px">${receiptCard()}</div>
    </section>
  </div>`;
}

function intel() {
  return `<section class="panel">
    <h2>Actor clusters — hunt behaviors, not people</h2>
    <p class="muted">Public MITRE groups only. Detection signature names. No biographies.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:12px">
      ${ACTORS.map(([id,a,h])=>`<div class="card"><div class="row"><span class="tiny" style="color:var(--primary)">${id}</span></div>
        <p>${a}</p><p class="mono tiny">${h}</p></div>`).join("")}
    </div>
    <p class="tiny" style="margin-top:18px">YAWAR · ${chain.length} receipts this process</p>
    <div class="list" style="margin-top:8px">${chain.slice().reverse().slice(0,8).map(r=>
      `<div class="card row"><span>${r.action} · ${r.decision}</span><span class="mono tiny">${(r.hash||"").slice(0,16)}</span></div>`
    ).join("")}</div>
  </section>`;
}

function doctrine() {
  return `<section class="panel">
    <h2>Taken from the leaders — made ours</h2>
    <p class="muted">Independently implemented under Doctrine v11. Λ remains Conjecture 1.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:12px">
      ${LEADERS.map(([n,t])=>`<div class="card"><strong>${n}</strong><p class="muted">${t}</p></div>`).join("")}
    </div>
    <p class="muted" style="margin-top:16px">Full TanStack COP with globe, RANGE, GHOST, WRAITH, ECHO lives on
      <a href="https://github.com/szl-holdings/immune-lattice">GitHub</a>. Kernel:
      <a href="https://huggingface.co/spaces/SZLHOLDINGS/immune">SZLHOLDINGS/immune</a>.</p>
  </section>`;
}

function draw() {
  nav();
  $("view").innerHTML = tab==="radar"?radar():tab==="estate"?estate():tab==="intel"?intel():doctrine();
  $("view").onclick = (e) => {
    const b = e.target.closest("[data-bind]");
    if (b) { doBind(b.dataset.bind, b.dataset.verb); return; }
    const c = e.target.closest("[data-canary]");
    if (c) doCanary(c.dataset.canary);
  };
}

(async () => {
  await Promise.all([refreshChain(), pullEstate()]);
  draw();
})();
</script>
</body>
</html>
